    <script>
      // Fix for environments/extensions attempting to override window.fetch when it only has a getter
      (function () {
        try {
          var rawFetch = window.fetch;
          var _fetch = rawFetch
            ? function () {
                return rawFetch.apply(window, arguments);
              }
            : undefined;

          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch;
            },
            set: function (newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Fallback if environment restricts property definition
        }
      })();
